# CD: build and publish the Mocter web image to GitHub Container Registry.
#
# Branch/tag strategy (branching contract):
#   - push `develop`  -> image tags `dev-<shortsha>` and `dev-latest` (test env)
#   - push `main`     -> image tag `latest`
#   - push tag v*.*.* -> image tag `<version>` (production release)
# Single-arch (linux/amd64) by design. Multi-arch can be added later.
name: CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag rules are event-gated so each trigger produces only its own tags.
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enuarrosales/mocter-web
          labels: |
            org.opencontainers.image.title=mocter-web
          tags: |
            type=raw,value=dev-latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'develop' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref_type == 'branch' && github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
