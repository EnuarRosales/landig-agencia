# CI: quality gate for pull requests targeting main or develop.
# Runs lint, unit/integration tests (with a disposable PostgreSQL 18 instance
# available to Vitest) and the full monorepo build via Turborepo.
name: CI

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mocter
          POSTGRES_PASSWORD: mocter
          POSTGRES_DB: mocter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mocter -d mocter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mocter:mocter@localhost:5432/mocter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
