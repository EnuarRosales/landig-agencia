# k8s/ secret template — projection for the future Kubernetes deployment.
#
# Usage order:
#   1. namespace.yaml
#   2. THIS FILE: copy to secrets.yaml (gitignored), fill real values, apply.
#
# Never store real credentials in git. Replace the placeholder below only in the
# local, untracked secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: mocter-web-secrets
  namespace: mocter
type: Opaque
stringData:
  # Format: postgres://<user>:<password>@<host>:<port>/<database> (PostgreSQL 18+).
  # Example (placeholder, replace in secrets.yaml):
  #   DATABASE_URL: postgres://mocter:CHANGE_ME@postgres.mocter.svc.cluster.local:5432/mocter
  DATABASE_URL: ""
