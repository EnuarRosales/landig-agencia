# Plantilla de Secretos para Kubernetes — Plataforma Mocter
#
# Instrucciones de uso:
#   1. Copiar este archivo a 'secrets.yaml' (ignorado en git):
#      cp k8s/secrets.example.yaml k8s/secrets.yaml
#   2. Asignar los valores reales en 'secrets.yaml'.
#   3. Aplicar en el cluster:
#      kubectl apply -f k8s/secrets.yaml
#
# ADVERTENCIA: NUNCA commitear archivos 'secrets.yaml' con credenciales reales.
apiVersion: v1
kind: Secret
metadata:
  name: mocter-web-secrets
  namespace: mocter
  labels:
    app.kubernetes.io/part-of: mocter-admin
type: Opaque
stringData:
  # Formato: postgres://<usuario>:<contraseña>@<host>:<puerto>/<base_de_datos>
  # NOTA: Si la contraseña contiene '@', debe codificarse como '%40'.
  # Para PostgreSQL interno en el cluster: pg-portal.mocter.svc.cluster.local:5432
  DATABASE_URL: "postgres://mocter:CONTRASENA_AQUI@pg-portal.mocter.svc.cluster.local:5432/db_portal"
  POSTGRES_USER: "mocter"
  POSTGRES_PASSWORD: "CONTRASENA_AQUI"
  POSTGRES_DB: "db_portal"

