# Manifiesto de Ingress — Enrutamiento HTTP/HTTPS perimetral para Mocter
#
# Controlador admitido: ingress-nginx (estándar de la industria).
# Gestiona la redirección canónica www -> non-www, terminación TLS y enrutamiento hacia el Service 'web-portal'.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-portal-ingress
  namespace: mocter
  labels:
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: mocter-admin
  annotations:
    kubernetes.io/ingress.class: nginx
    # Redirección automática de tráfico HTTP a HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Redirección de www.mocter.co a mocter.co
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    # Límite de carga para formularios o archivos
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Tiempos de espera adecuados para Server Actions y peticiones asíncronas
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Descomentar si se utiliza cert-manager para emisión automática de certificados Let's Encrypt:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Descomentar el bloque TLS una vez creado el Secret o configurado cert-manager:
  # tls:
  #   - hosts:
  #       - mocter.co
  #       - www.mocter.co
  #     secretName: mocter-tls-cert
  rules:
    - host: mocter.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80
    - host: www.mocter.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  number: 80
