# Entorno de desarrollo local: Servidor de desarrollo Next.js 16 con recarga en caliente (HMR) + PostgreSQL 18+.
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# Requisitos:
# - Archivo .env configurado con: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, DATABASE_URL.
#
# Servicios:
# - pg-portal: Motor PostgreSQL 18+ persistente en el volumen con nombre 'pgdata-portal' e inicialización Drizzle.
# - web-portal: Contenedor Node 24 con montaje bind del espacio de trabajo (.:/app). Las dependencias
#   (node_modules) y la compilación (.next) se aíslan en volúmenes Docker para proteger el host.

name: mocter-core

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-portal:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web-portal:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm install && node packages/domain/scripts/migrate.mjs && corepack pnpm dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # File watching over a Windows bind mount requires polling.
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      # Named volumes keep container-installed node_modules and .next out of the host.
      - root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - web-next:/app/apps/web/.next
      - domain-node-modules:/app/packages/domain/node_modules
    depends_on:
      pg-portal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-portal:
  root-node-modules:
  web-node-modules:
  web-next:
  domain-node-modules:
