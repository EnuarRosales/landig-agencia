# Uso: docker compose up --build
#
# Requisitos:
# - Archivo .env configurado con: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, DATABASE_URL, REDIS_PASSWORD.
#
# Servicios:
# - pg-portal: Motor PostgreSQL 18+ persistente en el volumen con nombre 'pgdata-portal' e inicialización Drizzle.
# - web-portal: Contenedor Node 24 con montaje bind del espacio de trabajo (.:/app). Las dependencias
#   (node_modules) y la compilación (.next) se aíslan en volúmenes Docker para proteger el host.
# - redis-control: Redis privado para el plano de control; no publica puertos ni persiste datos.
# - admin-portal: Shell de apps/admin (ADM-001 T-02) en el puerto 3003 (3002 lo usa otro stack); mismo patrón que web-portal con volúmenes propios.

name: mocter-core

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-portal:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-control:
    image: redis:8.8.4-alpine
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web-portal:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm install && node packages/domain/scripts/migrate.mjs && corepack pnpm --filter @mocter/web dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-control:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_RATE_LIMIT_PEPPER: ${AUTH_RATE_LIMIT_PEPPER:-mocter-dev-pepper}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3003,http://127.0.0.1:3003}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3003}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CELL_SECRETS_ACTIVE_KEY_ID: ${CELL_SECRETS_ACTIVE_KEY_ID:-k1}
      CELL_SECRETS_DIR: ${CELL_SECRETS_DIR:-/run/secrets}
      CELL_SECRETS_KEY: ${CELL_SECRETS_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI}
      CHATWOOT_SSO_SECRET: ${CHATWOOT_SSO_SECRET}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-http://localhost:3000}
      TOTP_ACTIVE_KEY_ID: ${TOTP_ACTIVE_KEY_ID:-k1}
      TOTP_SECRETS_DIR: ${TOTP_SECRETS_DIR:-/run/secrets}
      TOTP_KEY: ${TOTP_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-mocter-saas-platform-secure-key-32b}
      SETUP_OWNER_TOKEN: ${SETUP_OWNER_TOKEN}
      PORT: 3001
      # File watching over a Windows bind mount requires polling.
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      # Named volumes keep container-installed node_modules and .next out of the host.
      - root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - web-next:/app/apps/web/.next
      - domain-node-modules:/app/packages/domain/node_modules
    depends_on:
      pg-portal:
        condition: service_healthy
      redis-control:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  admin-portal:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm install && corepack pnpm --filter @mocter/admin dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-control:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3003
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-mocter-saas-platform-secure-key-32b}
      CHATWOOT_SSO_SECRET: ${CHATWOOT_SSO_SECRET}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3003}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      CHATWOOT_INTERNAL_URL: ${CHATWOOT_INTERNAL_URL:-http://mocter-chatwoot-rails-1:3000}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-http://localhost:3002}
      NEXT_PUBLIC_CHATWOOT_URL: ${NEXT_PUBLIC_CHATWOOT_URL:-http://localhost:3002}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      CHATWOOT_WEBHOOK_URL: ${CHATWOOT_WEBHOOK_URL:-http://admin-portal:3003/api/webhooks/chatwoot}
      CHATWOOT_SUPER_ADMIN_USER_ID: ${CHATWOOT_SUPER_ADMIN_USER_ID:-1}
      CELL_SECRETS_ACTIVE_KEY_ID: ${CELL_SECRETS_ACTIVE_KEY_ID:-k1}
      CELL_SECRETS_DIR: ${CELL_SECRETS_DIR:-/run/secrets}
      CELL_SECRETS_KEY: ${CELL_SECRETS_KEY}
      TOTP_ACTIVE_KEY_ID: ${TOTP_ACTIVE_KEY_ID:-k1}
      TOTP_SECRETS_DIR: ${TOTP_SECRETS_DIR:-/run/secrets}
      TOTP_KEY: ${TOTP_KEY}
      # File watching over a Windows bind mount requires polling.
      WATCHPACK_POLLING: "true"
    networks:
      - default
      - chatwoot-net
    ports:
      - "3003:3003"
    volumes:
      - .:/app
      # Named volumes keep container-installed node_modules and .next out of the host.
      - admin-root-node-modules:/app/node_modules
      - admin-node-modules:/app/apps/admin/node_modules
      - admin-next:/app/apps/admin/.next
      - admin-web-node-modules:/app/apps/web/node_modules
      - admin-domain-node-modules:/app/packages/domain/node_modules
    depends_on:
      pg-portal:
        condition: service_healthy
      redis-control:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-portal:
  root-node-modules:
  web-node-modules:
  web-next:
  domain-node-modules:
  admin-root-node-modules:
  admin-node-modules:
  admin-next:
  admin-web-node-modules:
  admin-domain-node-modules:

networks:
  default:
  chatwoot-net:
    name: mocter-chatwoot_default
    external: true
