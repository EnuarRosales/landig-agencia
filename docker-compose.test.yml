# Entorno de pruebas / staging (PROYECTADO): misma imagen que producción, etiqueta sha-<commit> de develop.
#
# - Servidor objetivo: VPS Hostinger KVM 4 idéntico a producción (amd64, Traefik v2.11,
#   red traefik_network, entrypoints web/websecure, certresolver mytlschallenge).
# - Sin dominio propio: APP_DOMAIN = <ip-con-guiones>.sslip.io (ej. 1-2-3-4.sslip.io).
# - Migraciones: servicio "migrate" con la MISMA imagen (ver docker-compose.prod.yml).
# - El despliegue automático está desactivado mientras la variable de repositorio
#   STAGING_ENABLED != 'true'.
#
# En el servidor este archivo se descarga como /opt/mocter-admin/compose.yml.
# .env requerido: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL, REDIS_PASSWORD, APP_DOMAIN, TAG

name: mocter-admin-test

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-portal:/var/lib/postgresql
    networks: [ backend ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-control:
    image: redis:8.8.4-alpine
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    networks: [ backend ]
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/enuarrosales/mocter-web:${TAG:-temp}
    profiles: [ "migrate" ]
    command: [ "node", "migrator/scripts/migrate.mjs" ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks: [ backend ]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      pg-portal:
        condition: service_healthy

  web-portal:
    image: ghcr.io/enuarrosales/mocter-web:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-control:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_RATE_LIMIT_PEPPER: ${AUTH_RATE_LIMIT_PEPPER:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-https://${APP_DOMAIN:-203-0-113-10.sslip.io}/auth/facebook/callback}
      CHATWOOT_SSO_SECRET: ${CHATWOOT_SSO_SECRET}
      TOTP_ACTIVE_KEY_ID: ${TOTP_ACTIVE_KEY_ID:-k1}
      TOTP_SECRETS_DIR: ${TOTP_SECRETS_DIR:-/run/secrets}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-soporte@mocter.co}
    networks: [ backend, traefik_network ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.mocter-test.entrypoints=websecure"
      - "traefik.http.routers.mocter-test.rule=Host(`${APP_DOMAIN:-203-0-113-10.sslip.io}`)"
      - "traefik.http.routers.mocter-test.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.mocter-test.service=mocter-test"
      - "traefik.http.services.mocter-test.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      pg-portal:
        condition: service_healthy
      redis-control:
        condition: service_healthy

  admin-portal:
    image: ghcr.io/enuarrosales/mocter-admin:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-control:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://${ADMIN_DOMAIN:-admin-203-0-113-10.sslip.io}}
    networks: [ backend, traefik_network ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.mocter-admin-test.entrypoints=websecure"
      - "traefik.http.routers.mocter-admin-test.rule=Host(`${ADMIN_DOMAIN:-admin-203-0-113-10.sslip.io}`)"
      - "traefik.http.routers.mocter-admin-test.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.mocter-admin-test.service=mocter-admin-test"
      - "traefik.http.services.mocter-admin-test.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      pg-portal:
        condition: service_healthy
      redis-control:
        condition: service_healthy

networks:
  backend:
    internal: true
  traefik_network:
    external: true

volumes:
  pgdata-portal:
