# Entorno de pruebas / staging: Contenedor con imagen de desarrollo precompilada + PostgreSQL 18+.
# Uso: docker compose -f docker-compose.test.yml up -d
#
# Requisitos:
# - Archivo .env configurado con: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, DATABASE_URL.
# - Imagen publicada en GHCR (ghcr.io/enuarrosales/mocter-web:develop).
#
# Servicios:
# - pg-portal: Motor PostgreSQL 18+ persistente en volumen 'pgdata-portal' e inicialización Drizzle.
# - web-portal: Aplicación web montada sobre la imagen develop, exponiendo el puerto 3000 mapeado al 3001.

name: mocter-admin

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-portal:/var/lib/postgresql
      - ./packages/domain/drizzle:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  web-portal:
    image: ghcr.io/enuarrosales/mocter-web:develop
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      pg-portal:
        condition: service_healthy

volumes:
  pgdata-portal: