# Entorno de producción: imagen única de Mocter desde GHCR + PostgreSQL 18 (pgvector).
#
# - Expuesto únicamente a través de Traefik v2.11 (red externa traefik_network,
#   entrypoint websecure, certresolver mytlschallenge). Ningún servicio publica puertos.
# - La redirección HTTP -> HTTPS la hace globalmente el entrypoint "web" de Traefik.
# - www.mocter.co redirige (301) a mocter.co.
# - Migraciones: servicio "migrate" (perfil "migrate") con la MISMA imagen que web-portal.
#   deploy.sh lo ejecuta antes de levantar web-portal. Aplica solo las migraciones
#   pendientes y las registra en drizzle.__drizzle_migrations.
#
# En el servidor este archivo se descarga como /opt/mocter-admin/compose.yml.
# Operación manual:
#   cd /opt/mocter-admin && docker compose -f compose.yml --env-file .env ps
#
# .env requerido: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL, REDIS_PASSWORD, TAG

name: mocter-admin-prod

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-portal:/var/lib/postgresql
    networks: [ backend ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 3s
      retries: 10

  redis-control:
    image: redis:8.8.4-alpine
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    networks: [ backend ]
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/enuarrosales/mocter-web:${TAG:-temp}
    profiles: [ "migrate" ]
    command: [ "node", "migrator/scripts/migrate.mjs" ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks: [ backend ]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      pg-portal:
        condition: service_healthy

  web-portal:
    image: ghcr.io/enuarrosales/mocter-web:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-control:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_RATE_LIMIT_PEPPER: ${AUTH_RATE_LIMIT_PEPPER:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://mocter.co,https://www.mocter.co}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://mocter.co}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mocter.co}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mocter.co/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://mocter.co/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-https://mocter.co/auth/facebook/callback}
      CHATWOOT_SSO_SECRET: ${CHATWOOT_SSO_SECRET}
      TOTP_ACTIVE_KEY_ID: ${TOTP_ACTIVE_KEY_ID:-k1}
      TOTP_SECRETS_DIR: ${TOTP_SECRETS_DIR:-/run/secrets}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-soporte@mocter.co}
    networks: [ backend, traefik_network ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.mocter-prod.entrypoints=websecure"
      - "traefik.http.routers.mocter-prod.rule=Host(`mocter.co`) || Host(`www.mocter.co`)"
      - "traefik.http.routers.mocter-prod.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.mocter-prod.middlewares=mocter-prod-www"
      - "traefik.http.routers.mocter-prod.service=mocter-prod"
      - "traefik.http.middlewares.mocter-prod-www.redirectregex.regex=^https://www\\.mocter\\.co/(.*)"
      - "traefik.http.middlewares.mocter-prod-www.redirectregex.replacement=https://mocter.co/$${1}"
      - "traefik.http.middlewares.mocter-prod-www.redirectregex.permanent=true"
      - "traefik.http.services.mocter-prod.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    depends_on:
      pg-portal:
        condition: service_healthy
      redis-control:
        condition: service_healthy

networks:
  backend:
    internal: true
  traefik_network:
    external: true

volumes:
  pgdata-portal:
