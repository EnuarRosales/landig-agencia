# Entorno de producción: Imagen standalone optimizada de Next.js desde GHCR + PostgreSQL 18+ persistente.
# Uso: docker compose -f docker-compose.prod.yml up -d
#
# Requisitos:
# - Archivo .env configurado con: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, DATABASE_URL, TAG.
# - Imagen productiva publicada en GHCR (ghcr.io/enuarrosales/mocter-web:${TAG:-latest}).
#
# Servicios:
# - pg-portal: Motor PostgreSQL 18+ con persistencia en el volumen 'pgdata-portal' e inicialización Drizzle.
# - web-portal: Contenedor productivo standalone de Next.js en el puerto interno 3000 (mapeado al 3001 del host).


name: mocter-admin

services:
  pg-portal:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata-portal:/var/lib/postgresql
      - ./packages/domain/drizzle:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
  
  web-portal:
    image: ghcr.io/enuarrosales/mocter-web:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      pg-portal:
        condition: service_healthy

volumes:
  pgdata-portal:
